<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>MarkLayer 原生缩放验收 fixture</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f5f6f8; color: #222; }
  header { height: 56px; background: #1f2937; color: #fff; display: flex; align-items: center; padding: 0 16px; }
  main { padding: 24px; display: grid; gap: 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #target { width: 320px; height: 120px; background: linear-gradient(135deg, #6366f1, #06b6d4); border-radius: 6px; }
  #target2 { width: 180px; height: 64px; background: #f59e0b; border-radius: 6px; }
  p { max-width: 560px; }
</style>
</head>
<body>
<header>MarkLayer zoom fixture</header>
<main>
  <div class="card">
    <p>这块区域用来验证注释覆盖层在浏览器原生缩放（Ctrl+= / Ctrl+- / Ctrl+0）下是否仍然对齐。</p>
    <div id="target"></div>
  </div>
  <div class="card">
    <p>第二个目标元素，尺寸不同，用来交叉验证。</p>
    <div id="target2"></div>
  </div>
</main>
</body>
</html>
